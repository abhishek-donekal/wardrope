<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
/* Subtle paper texture using multiple radial gradients */
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:640px; height:640px; }

.wordmark {
  position:absolute; bottom:150px; left:0; right:0; text-align:center;
  color:#EFE4D2;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:34px; font-weight:500;
  letter-spacing:30px; text-transform:uppercase;
  text-indent:30px; opacity:0.9;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- Geometric W made of clean strokes, like a hanger triangle echo -->
      <path d="M 80 120 L 230 520 L 320 280 L 410 520 L 560 120"
            stroke="#EFE4D2" stroke-width="36" stroke-linejoin="miter" stroke-linecap="square"/>
      <!-- Thin horizontal accent line above (suggests a hanger bar) -->
      <line x1="180" y1="60" x2="460" y2="60" stroke="#EFE4D2" stroke-width="6" stroke-linecap="square" opacity="0.55"/>
      <!-- Small dot serving as a hanger hook -->
      <circle cx="320" cy="30" r="10" fill="#EFE4D2" opacity="0.55"/>
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
