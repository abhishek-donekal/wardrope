<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#F4EFE6; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:
    radial-gradient(circle at 50% 35%, #F8F2E6 0%, #ECE4D2 70%, #DDD2BB 100%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  gap:48px;
}
.mark {
  color:#0A0A0A;
  font-family:"Didot","Bodoni 72","Bodoni MT",Georgia,serif;
  font-size:600px; font-weight:400; line-height:1;
  letter-spacing:-30px;
  text-shadow:0 2px 0 rgba(197,160,89,0.20);
}
.hairline {
  width:520px; height:1px; background:#0A0A0A; opacity:0.4;
}
.wordmark {
  color:#0A0A0A; opacity:0.78;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:36px; font-weight:600;
  letter-spacing:22px; text-transform:uppercase;
  text-indent:22px;
}
.corner {
  position:absolute; width:60px; height:60px;
  border:1.5px solid #0A0A0A; opacity:0.35;
}
.tl { top:60px; left:60px; border-right:none; border-bottom:none; }
.tr { top:60px; right:60px; border-left:none; border-bottom:none; }
.bl { bottom:60px; left:60px; border-right:none; border-top:none; }
.br { bottom:60px; right:60px; border-left:none; border-top:none; }
</style></head><body>
<div class="frame">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="mark-wrap">
    <div class="mark">W</div>
    <div class="hairline"></div>
    <div class="wordmark">WARDROBE</div>
  </div>
</div>
</body></html>
