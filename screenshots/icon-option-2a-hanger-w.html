<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:720px; height:720px; }

.wordmark {
  position:absolute; bottom:140px; left:0; right:0; text-align:center;
  color:#EFE4D2; opacity:0.85;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:32px; font-weight:500;
  letter-spacing:28px; text-transform:uppercase; text-indent:28px;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 720 720" fill="none" stroke="#EFE4D2"
         stroke-width="34" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Hanger hook -->
      <path d="M 360 80
               Q 360 130, 405 130
               Q 440 130, 440 100"
            stroke-width="24" stroke-linecap="round" fill="none"/>
      <!-- Hanger triangle + W: the bottom triangle uses W zig-zag form -->
      <!-- top hanger bar -->
      <line x1="120" y1="240" x2="600" y2="240"/>
      <!-- left diagonal of hanger down to first W valley -->
      <path d="M 120 240 L 250 580 L 360 360 L 470 580 L 600 240" />
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
