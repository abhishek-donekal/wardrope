<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:780px; height:780px; }

.wordmark {
  position:absolute; bottom:130px; left:0; right:0; text-align:center;
  color:#EFE4D2; opacity:0.85;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:32px; font-weight:500;
  letter-spacing:28px; text-transform:uppercase; text-indent:28px;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 780 780" fill="none">
      <g stroke="#EFE4D2" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Hook -->
        <path d="M 390 130
                 Q 390 215, 470 215
                 Q 525 215, 525 165"/>
        <!-- Triangle -->
        <path d="M 390 215 L 110 510 L 670 510 Z"/>
      </g>
      <!-- Tiny gold accent dot at hook tip -->
      <circle cx="525" cy="165" r="10" fill="#C5A059"/>
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
