<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:780px; height:780px; }

.wordmark {
  position:absolute; bottom:130px; left:0; right:0; text-align:center;
  color:#EFE4D2; opacity:0.85;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:32px; font-weight:500;
  letter-spacing:28px; text-transform:uppercase; text-indent:28px;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 780 780" fill="none">
      <!-- Hanger: graceful arched bar + slender hook -->
      <g fill="none" stroke="#EFE4D2" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
        <!-- Hook -->
        <path d="M 390 120
                 C 390 175, 455 175, 455 130"/>
        <!-- Gentle arched bar -->
        <path d="M 175 305
                 Q 390 215, 605 305"/>
      </g>

      <!-- A-line dress garment in warm gold -->
      <g fill="#C5A059">
        <!-- shoulders + neckline + flowing skirt -->
        <path d="M 200 305
                 L 270 290
                 L 320 320
                 L 360 305
                 L 420 305
                 L 460 320
                 L 510 290
                 L 580 305
                 L 555 360
                 L 540 420
                 L 560 500
                 L 600 600
                 L 620 680
                 L 160 680
                 L 180 600
                 L 220 500
                 L 240 420
                 L 225 360
                 Z"/>
      </g>

      <!-- darker fold line down the center for fabric drape -->
      <path d="M 390 320 L 390 680"
            stroke="#1A1A1A" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
      <!-- subtle neckline V -->
      <path d="M 350 305 L 390 360 L 430 305"
            stroke="#1A1A1A" stroke-width="6" fill="none" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
