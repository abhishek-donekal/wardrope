<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:720px; height:720px; }

.wordmark {
  position:absolute; bottom:140px; left:0; right:0; text-align:center;
  color:#EFE4D2; opacity:0.85;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:32px; font-weight:500;
  letter-spacing:28px; text-transform:uppercase; text-indent:28px;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 720 720" fill="none">
      <!-- Hanger arc cradle (curved bar) at top, hook above -->
      <g stroke="#EFE4D2" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Hook -->
        <path d="M 360 70
                 Q 360 120, 405 120
                 Q 440 120, 440 88"/>
        <!-- Curved hanger bar (gentle arc) -->
        <path d="M 100 250 Q 360 120, 620 250"/>
        <!-- Left/right arms going down to the bar tips -->
        <path d="M 360 120 L 100 250"/>
        <path d="M 360 120 L 620 250"/>
      </g>
      <!-- Serif W cradled below -->
      <text x="360" y="600"
            text-anchor="middle"
            font-family='"Didot","Bodoni 72",Georgia,serif'
            font-size="420"
            font-weight="400"
            fill="#EFE4D2"
            letter-spacing="-18">W</text>
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
