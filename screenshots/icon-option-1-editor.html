<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#050505; }
.frame {
  width:1024px; height:1024px; position:relative;
  background: radial-gradient(circle at 50% 38%, #1A130B 0%, #0A0805 60%, #050505 100%);
}
.mark {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%, -52%);
  color:#C5A059;
  font-family:"Didot","Bodoni 72","Bodoni MT",Georgia,serif;
  font-size:780px; font-weight:400; line-height:1;
  letter-spacing:-40px;
  text-shadow:0 0 80px rgba(197,160,89,0.30), 0 6px 0 rgba(0,0,0,0.45);
}
.wordmark {
  position:absolute; bottom:130px; left:0; right:0; text-align:center;
  color:#C5A059; opacity:0.78;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:38px; font-weight:600;
  letter-spacing:24px; text-transform:uppercase;
  text-indent:24px;
}
</style></head><body>
<div class="frame">
  <div class="mark">W</div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
