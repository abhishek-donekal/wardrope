<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1242">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1242px; height:2688px; background:#050505; font-family:-apple-system,sans-serif; overflow:hidden; position:relative; }
  .status { display:flex; justify-content:space-between; align-items:center; padding:18px 48px 0; }
  .time { color:#fff; font-size:36px; font-weight:600; }
  .icons { color:#fff; font-size:28px; }
  .header { padding:48px 48px 40px; }
  .overline { color:#A3A3A3; font-size:24px; letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; }
  .h2 { color:#fff; font-family:Georgia,serif; font-size:72px; letter-spacing:-2px; }
  .looks-grid { padding:0 48px; display:flex; flex-direction:column; gap:28px; }
  .look-card { background:#121212; border:2px solid #2A2A2A; padding:36px; }
  .look-meta { color:#A3A3A3; font-size:22px; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
  .look-name { color:#fff; font-family:Georgia,serif; font-size:44px; margin-bottom:28px; }
  .look-items { display:flex; gap:16px; }
  .look-item { width:140px; height:165px; background:#1A1A1A; border:1px solid #333; display:flex; align-items:center; justify-content:center; font-size:56px; }
  .look-footer { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
  .look-tags { display:flex; gap:12px; }
  .look-tag { padding:10px 20px; border:1px solid #333; border-radius:999px; color:#A3A3A3; font-size:20px; }
  .heart { color:#C5A059; font-size:36px; }
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:180px; background:#050505; border-top:1px solid #2A2A2A; display:flex; align-items:flex-start; justify-content:space-around; padding-top:24px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .tab-icon { font-size:44px; }
  .tab-label { font-size:20px; color:#A3A3A3; }
</style>
</head>

</html>
