<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#0A0A0A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:
    linear-gradient(135deg, #1A1208 0%, #0A0A0A 55%, #050505 100%);
}
.frame::after {
  content:""; position:absolute; inset:0;
  background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(0,0,0,0.4) 95%);
  pointer-events:none;
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
}
.mark-svg { width:660px; height:660px; }

.wordmark {
  position:absolute; bottom:140px; left:0; right:0; text-align:center;
  color:#C5A059;
  font-family:"Didot","Bodoni 72","Bodoni MT",Georgia,serif;
  font-size:50px; font-style:italic; font-weight:400;
  letter-spacing:8px; opacity:0.9;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 660 660" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- Outer thin gold circle -->
      <circle cx="330" cy="330" r="290" stroke="#C5A059" stroke-width="2" opacity="0.45"/>
      <circle cx="330" cy="330" r="280" stroke="#C5A059" stroke-width="1" opacity="0.30"/>

      <!-- Two interlocked hangers forming a stylized W / monogram -->
      <g stroke="#C5A059" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Left hanger -->
        <path d="M 220 200
                 Q 220 235, 250 235
                 Q 275 235, 275 215"/>
        <path d="M 220 235 L 110 365 L 330 365 Z"/>
        <!-- Right hanger -->
        <path d="M 440 200
                 Q 440 235, 410 235
                 Q 385 235, 385 215"/>
        <path d="M 440 235 L 330 365 L 550 365 Z"/>
      </g>

      <!-- Serif W behind / overlaid in deep gold -->
      <text x="330" y="490"
            text-anchor="middle"
            font-family='"Didot","Bodoni 72",Georgia,serif'
            font-size="320"
            font-weight="400"
            fill="#C5A059"
            opacity="0.95"
            letter-spacing="-12">W</text>
    </svg>
  </div>
  <div class="wordmark">Wardrobe</div>
</div>
</body></html>
