<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1024px; height:1024px; }
body { background:#1A1A1A; }
.frame {
  width:1024px; height:1024px; position:relative;
  background:#1A1A1A;
}
.frame::before {
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent 40%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,0.35), transparent 50%);
}
.mark-wrap {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
}
.mark-svg { width:760px; height:760px; }

.wordmark {
  position:absolute; bottom:130px; left:0; right:0; text-align:center;
  color:#EFE4D2; opacity:0.85;
  font-family:-apple-system,Helvetica,Arial,sans-serif;
  font-size:32px; font-weight:500;
  letter-spacing:28px; text-transform:uppercase; text-indent:28px;
}
</style></head><body>
<div class="frame">
  <div class="mark-wrap">
    <svg class="mark-svg" viewBox="0 0 760 760" fill="none">
      <!-- Bold hanger -->
      <g stroke="#EFE4D2" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Hook -->
        <path d="M 380 100
                 Q 380 160, 435 160
                 Q 480 160, 480 120"/>
        <!-- Triangle bar -->
        <path d="M 380 160 L 130 360 L 630 360 Z"/>
      </g>
      <!-- W as the 'garment' hanging from the bar -->
      <g fill="#C5A059">
        <path d="M 195 360 L 245 580 L 320 460 L 380 580 L 440 460 L 515 580 L 565 360 Z"/>
      </g>
    </svg>
  </div>
  <div class="wordmark">WARDROBE</div>
</div>
</body></html>
