  .row { display:flex; justify-content:space-between; align-items:center; padding:36px 36px; border-bottom:1px solid #2A2A2A; }
  .row:last-child { border-bottom:none; }
  .row-label { color:#A3A3A3; font-size:26px; letter-spacing:1.5px; text-transform:uppercase; }
  .row-value { color:#fff; font-size:28px; }

  .row-arrow { color:#A3A3A3; font-size:36px; }
  .tab-bar { position:absolute; bottom:0; left:0; right:0; height:180px; background:#050505; border-top:1px solid #2A2A2A; display:flex; align-items:flex-start; justify-content:space-around; padding-top:24px; }
  .tab { display:flex; flex-direction:column; align-items:center; gap:8px; }
